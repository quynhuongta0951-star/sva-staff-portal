<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183B5B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SVA Staff Portal">
  <title>SVA Staff Portal</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#183B5B;font-family:"Times New Roman",serif;overflow:hidden}
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#183B5B;color:#fff}
    .card{text-align:center;padding:24px;width:min(360px,90vw)}
    .logo{width:112px;height:112px;border-radius:28px;background:white;padding:8px;object-fit:contain;box-shadow:0 12px 32px rgba(0,0,0,.18)}
    h1{font-size:25px;margin:18px 0 5px}
    .sub{opacity:.86;font-size:15px}
    .spinner{width:38px;height:38px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:22px auto;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .status{font-size:13px;line-height:1.45;opacity:.88}
    .openbtn{display:none;margin:18px auto 0;border:0;border-radius:14px;padding:12px 18px;background:#fff;color:#183B5B;font-family:inherit;font-weight:700;font-size:15px}
  </style>
</head>
<body>
<div id="splash">
  <div class="card">
    <img class="logo" src="./icon-192.png" alt="Sunshine Village Academy">
    <h1>SVA Staff Portal</h1>
    <div class="sub">Sunshine Village Academy</div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Đang mở cổng nhân sự… / Opening staff portal…</div>
    <button class="openbtn" id="openbtn" onclick="openPortal()">Mở Portal / Open Portal</button>
  </div>
</div>

<script src="./config.js"></script>
<script>
  function openPortal() {
    window.location.replace(window.SVA_CONFIG.PORTAL_URL);
  }

  // iframe was unreliable on iOS/Apps Script. Redirect is much more reliable.
  setTimeout(openPortal, 650);

  // Fallback if iOS blocks the automatic cross-origin navigation for any reason.
  setTimeout(() => {
    document.getElementById('spinner').style.display='none';
    document.getElementById('status').textContent='Nếu chưa chuyển sang Portal, bấm nút bên dưới. / If the Portal did not open, tap below.';
    document.getElementById('openbtn').style.display='block';
  }, 5000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
</script>
</body>
</html>
