<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183B5B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SVA Staff Portal">
  <meta name="application-name" content="SVA Staff Portal">
  <title>SVA Staff Portal</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#f6f8fa;font-family:"Times New Roman",serif;overflow:hidden}
    body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
          padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
    #app{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
          background:#f6f8fa}
    #portal{position:absolute;inset:0;width:100%;height:100%;border:0;background:white;opacity:0;transition:opacity .12s ease}
    #portal.ready{opacity:1}
    #splash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#183B5B;color:white;z-index:3}
    .splash-card{text-align:center;padding:28px}
    .splash-card img{width:110px;height:110px;border-radius:28px;background:white;padding:7px;box-shadow:0 14px 36px rgba(0,0,0,.18)}
    .title{font-size:24px;font-weight:700;margin-top:16px}
    .sub{font-size:14px;opacity:.86;margin-top:5px}
    .loader{width:36px;height:36px;border:4px solid rgba(255,255,255,.28);border-top-color:white;border-radius:50%;
             margin:22px auto 0;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #offline{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:none;z-index:5;
              padding:10px 12px;border-radius:12px;background:#fff3cd;color:#6b4e00;border:1px solid #f0cf68;text-align:center;font-size:13px}
    #tools{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;display:none;gap:6px}
    #tools button{border:0;border-radius:10px;padding:8px 10px;background:#183B5B;color:white;font-family:inherit}
    @media (display-mode:standalone){#tools{display:none!important}}
  </style>
</head>
<body>
<div id="app">
  <div id="splash">
    <div class="splash-card">
      <img src="icons/icon-192.png" alt="SVA">
      <div class="title">SVA Staff Portal</div>
      <div class="sub">Sunshine Village Academy</div>
      <div class="loader"></div>
    </div>
  </div>

  <iframe
    id="portal"
    title="SVA Staff Portal"
    allow="camera; microphone; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>

<div id="offline">Mất kết nối mạng / You are offline. Portal sẽ tự tải lại khi có mạng.</div>

<script src="config.js"></script>
<script>
  const frame = document.getElementById('portal');
  const splash = document.getElementById('splash');
  const offline = document.getElementById('offline');

  function loadPortal() {
    frame.src = window.SVA_CONFIG.PORTAL_URL;
  }

  frame.addEventListener('load', () => {
    frame.classList.add('ready');
    setTimeout(() => splash.style.display = 'none', 120);
  });

  window.addEventListener('online', () => {
    offline.style.display = 'none';
    if (!frame.src) loadPortal();
  });
  window.addEventListener('offline', () => {
    offline.style.display = 'block';
  });

  if (!navigator.onLine) offline.style.display = 'block';
  loadPortal();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
</body>
</html>
